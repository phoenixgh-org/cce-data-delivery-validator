# Local/dev bring-up: Postgres + app, healthcheck-gated (mirrors ../tremble).
# The app only starts once Postgres reports healthy. DB connection info is wired
# through env and consumed by the pg pool (src/db/pool.ts): DATABASE_URL when set,
# otherwise the PG* vars.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cce-validator-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cce_validator}
      POSTGRES_USER: ${POSTGRES_USER:-cce_validator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cce_validator}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-boot ordered schema SQL (10-session, 20-transmission, 30-finding,
      # 40-indexes, 50-session-auth-bearer).
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cce-validator-app:local
    container_name: cce-validator-app
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-cce_validator}:${POSTGRES_PASSWORD:-cce_validator}@postgres:5432/${POSTGRES_DB:-cce_validator}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-cce_validator}
      PGUSER: ${POSTGRES_USER:-cce_validator}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cce_validator}
      # Address(es) whose X-Forwarded-* headers Fastify trusts (src/app.ts).
      # Loopback by default = trust nobody but ourselves, which is right for the
      # dev flow below. Behind the `edge` profile the proxy is a CONTAINER, so
      # this must name its address/subnet or X-Forwarded-Proto is ignored — set
      # TRUSTED_PROXY in .env. See docs/deployment.md.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-127.0.0.1}
      # Cadence of the §11 retention sweep (src/index.ts), default 1 h. Passed
      # through from .env like TRUSTED_PROXY above — without this line the app
      # never sees it, since compose reads .env only for ${...} interpolation
      # and the app has no dotenv (bug 4w4). Cadence only: it changes how
      # promptly expired sessions are reaped, never the 7-day window itself.
      RETENTION_SWEEP_MS: ${RETENTION_SWEEP_MS:-3600000}
    ports:
      # Dev convenience. In production the app port must NOT be publicly
      # reachable (DESIGN §4.1): bind it to loopback ('127.0.0.1:3000:3000') or
      # drop this mapping entirely and reach the app only via the edge profile.
      - '${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # TLS edge (DESIGN.md §4.1). Behind an OPTIONAL compose profile so the dev
  # flow is untouched: `docker compose up -d` and `docker compose up -d postgres`
  # never start it, because a profiled service only runs when its profile is
  # selected. Bring it up with:
  #
  #   docker compose --profile edge up -d
  #
  # deploy/Caddyfile IS the proxy contract (X-Forwarded-Proto, no body cap below
  # the app's thresholds, body passed through uncompressed). Edit the hostname
  # and set TRUSTED_PROXY before first boot, then verify with
  # deploy/smoke-proxy-contract.sh. See docs/deployment.md.
  caddy:
    image: caddy:2-alpine
    container_name: cce-validator-caddy
    profiles: ['edge']
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates + ACME account state; losing these means re-issuing certs.
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:
  caddyconfig:
